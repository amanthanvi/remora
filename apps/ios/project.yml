name: Remora
options:
  bundleIdPrefix: com.remora.app
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  fileTypes:
    icon:
      file: true

# DeveloperID is a release-style configuration used by the Mac Catalyst
# direct-distribution lane (notarized .dmg). It points the RemoraMac target
# at a separate, unsandboxed entitlements file so the app can spawn a local
# `codex app-server`. The Mac App Store lane stays on Release with sandbox.
configs:
  Debug: debug
  Release: release
  DeveloperID: release

settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: targeted
    MARKETING_VERSION: "1.5.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_OBJC_BRIDGING_HEADER: Sources/Remora/Bridge/codex_bridge_objc.h
    OTHER_LDFLAGS: "$(inherited) -lc++ -lz -lresolv -lcodex_mobile_client"
    HEADER_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/GeneratedRust/Headers"
    SWIFT_INCLUDE_PATHS: "$(inherited) $(PROJECT_DIR)/GeneratedRust/Headers"
    "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": "$(inherited) $(PROJECT_DIR)/GeneratedRust/ios-device"
    "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": "$(inherited) $(PROJECT_DIR)/GeneratedRust/ios-sim"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    DEVELOPMENT_TEAM: UH66Q8ZAYG
    # Xcode 15+ explicit-module builds. First clean build is slightly
    # slower, but module graphs are cached per-target after that, so
    # incremental Swift compiles in the app target drop substantially.
    SWIFT_ENABLE_EXPLICIT_MODULES: "YES"
    CLANG_ENABLE_EXPLICIT_MODULES: "YES"

packages:
  Hairball:
    url: https://github.com/dnakov/hairball.git
    branch: main
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: "147.0.0"
  Nuke:
    url: https://github.com/kean/Nuke.git
    from: "12.8.0"
targets:
  Remora:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    entitlements:
      path: Sources/Remora/Remora.entitlements
      properties:
        aps-environment: production
        com.apple.developer.carplay-voice-based-conversation: true
        # iCloud KVS sync (Feature C). Re-add when the iCloud container
        # `iCloud.com.remora.app` exists in the Apple Developer Portal
        # AND is enabled on the iOS app's provisioning profile. Without
        # both, archive fails: "Provisioning profile doesn't include the
        # iCloud capability."
        # com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)iCloud.com.remora.app
        com.apple.security.application-groups:
          - group.com.remora.app
    attributes:
      SystemCapabilities:
        com.apple.BackgroundModes:
          enabled: true
    sources:
      - path: Sources/Remora
        excludes:
          - "**/*.h"
      - path: Sources/Remora/Bridge/UniFFICodexClient.generated.swift
      - path: Resources/fs
        type: folder
        buildPhase: resources
      - path: Sources/RemoraLiveActivity/CodexTurnLiveActivity.swift
      - path: Sources/RemoraWatch/Models/WatchModels.swift
      - path: Sources/RemoraWatch/Models/WatchSize.swift
      - path: Sources/RemoraWatch/Models/WatchHapticDetector.swift
      - path: Sources/RemoraWatch/Models/WatchSnapshotStore.swift
      - path: Sources/RemoraWatch/Models/WatchDeepLinkRouter.swift
      - path: Sources/RemoraWatchComplications/RemoraServerListPayload.swift
      - path: Sources/RemoraWatchComplications/RemoraComplicationEntry.swift
      - path: Sources/RemoraWatchComplications/RemoraRunningTurnPayload.swift
    resources:
      - path: Sources/Remora/Resources/Fonts
      - path: Sources/Remora/Resources/Themes
      - path: Sources/Remora/Resources/TipJarProducts.storekit
      - path: Sources/Remora/Resources/remora_home.png
      - path: Sources/Remora/Resources/remora_home_entrance.png
      - path: Sources/Remora/Resources/remora_transmission_01.png
      - path: Sources/Remora/Resources/remora_transmission_02.png
      - path: Sources/Remora/Resources/remora_transmission_03.png
      - path: Sources/Remora/Resources/remora_transmission_04.png
      - path: Sources/Remora/Resources/remora_transmission_05.png
      - path: Sources/Remora/Resources/remora_transmission_06.png
    dependencies:
      - sdk: CarPlay.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreText.framework
      - sdk: CoreVideo.framework
      - sdk: IOSurface.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: Network.framework
      - package: Hairball
        product: HairballUI
      - package: WebRTC
        product: WebRTC
      - package: Nuke
        product: Nuke
      - package: Nuke
        product: NukeUI
      - target: RemoraLiveActivity
        embed: true
      - target: RemoraWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.remora.app
        INFOPLIST_FILE: Sources/Remora/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Remora/Bridge/codex_bridge_objc.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIBackgroundModes: "audio fetch remote-notification picture-in-picture"
      configs:
        Debug:
          CODE_SIGN_STYLE: "$(APP_CODE_SIGN_STYLE)"
          APP_CODE_SIGN_STYLE: Automatic
          PROVISIONING_PROFILE_SPECIFIER: "$(APP_PROVISIONING_PROFILE_SPECIFIER)"
          APP_PROVISIONING_PROFILE_SPECIFIER: ""
          OTHER_LDFLAGS: "$(inherited) -lc++ -lz -lresolv -lcodex_mobile_client -lghostty"
        Release:
          CODE_SIGN_STYLE: "$(APP_CODE_SIGN_STYLE)"
          APP_CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "$(APP_CODE_SIGN_IDENTITY)"
          APP_CODE_SIGN_IDENTITY: ""
          PROVISIONING_PROFILE_SPECIFIER: "$(APP_PROVISIONING_PROFILE_SPECIFIER)"
          APP_PROVISIONING_PROFILE_SPECIFIER: ""
          OTHER_LDFLAGS: "$(inherited) -lc++ -lz -lresolv -lcodex_mobile_client -lghostty"
  RemoraMac:
    type: application
    platform: auto
    supportedDestinations:
      - macCatalyst
    entitlements:
      path: Sources/Remora/Remora-Catalyst.entitlements
      properties:
        aps-environment: production
        # iCloud KVS sync (Feature C). Re-add when the iCloud container
        # `iCloud.com.remora.app` exists in the Apple Developer Portal
        # AND the Mac App Store profile is regenerated to include the iCloud
        # capability. Direct-dist (DeveloperID entitlements) keeps the key
        # because Developer ID apps validate iCloud at runtime, not via profile.
        # com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)iCloud.com.remora.app
        com.apple.security.application-groups:
          - group.com.remora.app
        com.apple.security.app-sandbox: true
        com.apple.security.device.bluetooth: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
    sources:
      - path: Sources/Remora
        excludes:
          - CarPlay/**
          - Info.plist
          - Remora.entitlements
          - Remora-Catalyst.entitlements
          - Remora-Catalyst-DeveloperID.entitlements
          - Models/AppLifecycleController.swift
          - Models/AppRuntimeController.swift
          - Models/CodexTurnAttributes.swift
          - Models/CodexVoiceCallAttributes.swift
          - Models/OrientationResponder.swift
          - Models/RealtimeWebRtcSession.swift
          - Models/StableSafeAreaInsets.swift
          - Models/TurnLiveActivityController.swift
          - Models/VoiceRuntimeController.swift
          - Models/VoiceSessionControl.swift
          - Models/VoiceSessionModels.swift
          - Models/WatchCompanionBridge.swift
          - Models/WatchProjection.swift
          - Views/HomeVoiceOrbButton.swift
          - Views/InlineVoiceButton.swift
          - Views/InlineVoiceStatusStrip.swift
          - Views/LiveActivityPreview.swift
          - Views/LockScreenCardView.swift
          - Views/RealtimeVoiceScreen.swift
          - Views/VoiceCallView.swift
          - "**/*.h"
      - path: Sources/Remora/Bridge/UniFFICodexClient.generated.swift
    resources:
      - path: Sources/Remora/Resources/Fonts
      - path: Sources/Remora/Resources/Themes
      - path: Sources/Remora/Resources/TipJarProducts.storekit
      - path: Sources/Remora/Resources/remora_home.png
      - path: Sources/Remora/Resources/remora_home_entrance.png
      - path: Sources/Remora/Resources/remora_transmission_01.png
      - path: Sources/Remora/Resources/remora_transmission_02.png
      - path: Sources/Remora/Resources/remora_transmission_03.png
      - path: Sources/Remora/Resources/remora_transmission_04.png
      - path: Sources/Remora/Resources/remora_transmission_05.png
      - path: Sources/Remora/Resources/remora_transmission_06.png
    dependencies:
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: Network.framework
      - package: Hairball
        product: HairballUI
      - package: Nuke
        product: Nuke
      - package: Nuke
        product: NukeUI
    settings:
      base:
        PRODUCT_NAME: Remora
        PRODUCT_BUNDLE_IDENTIFIER: com.remora.app
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        INFOPLIST_FILE: Sources/Remora/Info-Catalyst.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconMac
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Remora/Bridge/codex_bridge_objc.h
        SUPPORTS_MACCATALYST: YES
        SUPPORTS_MACCATALYST_OPTIMIZED_FOR_MAC: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        "LIBRARY_SEARCH_PATHS[sdk=macosx*]": "$(inherited) $(PROJECT_DIR)/GeneratedRust/ios-macabi"
      configs:
        Debug:
          CODE_SIGN_STYLE: "$(APP_CODE_SIGN_STYLE)"
          APP_CODE_SIGN_STYLE: Automatic
          PROVISIONING_PROFILE_SPECIFIER: "$(APP_PROVISIONING_PROFILE_SPECIFIER)"
          APP_PROVISIONING_PROFILE_SPECIFIER: ""
          OTHER_LDFLAGS: "$(inherited) -lc++ -lz -lresolv -lcodex_mobile_client -lghostty"
        Release:
          CODE_SIGN_STYLE: "$(APP_CODE_SIGN_STYLE)"
          APP_CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "$(APP_CODE_SIGN_IDENTITY)"
          APP_CODE_SIGN_IDENTITY: ""
          PROVISIONING_PROFILE_SPECIFIER: "$(APP_PROVISIONING_PROFILE_SPECIFIER)"
          APP_PROVISIONING_PROFILE_SPECIFIER: ""
          OTHER_LDFLAGS: "$(inherited) -lc++ -lz -lresolv -lcodex_mobile_client -lghostty"
        # Direct-distribution (notarized .dmg) lane. Re-points
        # CODE_SIGN_ENTITLEMENTS at the unsandboxed entitlements file so the
        # Mac build can spawn a local `codex app-server`. Same automatic
        # signing flow as Release; the actual cert is selected via the
        # APP_CODE_SIGN_IDENTITY override the script passes through.
        DeveloperID:
          CODE_SIGN_STYLE: "$(APP_CODE_SIGN_STYLE)"
          APP_CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "$(APP_CODE_SIGN_IDENTITY)"
          APP_CODE_SIGN_IDENTITY: ""
          PROVISIONING_PROFILE_SPECIFIER: "$(APP_PROVISIONING_PROFILE_SPECIFIER)"
          APP_PROVISIONING_PROFILE_SPECIFIER: ""
          OTHER_LDFLAGS: "$(inherited) -lc++ -lz -lresolv -lcodex_mobile_client -lghostty"
          ENABLE_HARDENED_RUNTIME: YES
          CODE_SIGN_ENTITLEMENTS: Sources/Remora/Remora-Catalyst-DeveloperID.entitlements
  RemoraLiveActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    entitlements:
      path: Sources/RemoraLiveActivity/RemoraLiveActivity.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.remora.app
    sources:
      - path: Sources/RemoraLiveActivity
      - path: Sources/Remora/Models/CodexTurnAttributes.swift
      - path: Sources/Remora/Models/CodexVoiceCallAttributes.swift
      - path: Sources/Remora/Models/RemoraPalette.swift
      - path: Sources/Remora/Models/VoiceSessionControl.swift
      - path: Sources/Remora/Views/LockScreenCardView.swift
    resources:
      - path: Sources/RemoraLiveActivity/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.remora.app.liveactivity
        INFOPLIST_FILE: Sources/RemoraLiveActivity/Info.plist
      configs:
        Debug:
          CODE_SIGN_STYLE: "$(LIVE_ACTIVITY_CODE_SIGN_STYLE)"
          LIVE_ACTIVITY_CODE_SIGN_STYLE: Automatic
          PROVISIONING_PROFILE_SPECIFIER: "$(LIVE_ACTIVITY_PROVISIONING_PROFILE_SPECIFIER)"
          LIVE_ACTIVITY_PROVISIONING_PROFILE_SPECIFIER: ""
          ENABLE_DEBUG_DYLIB: NO
        Release:
          CODE_SIGN_STYLE: "$(LIVE_ACTIVITY_CODE_SIGN_STYLE)"
          LIVE_ACTIVITY_CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "$(LIVE_ACTIVITY_CODE_SIGN_IDENTITY)"
          LIVE_ACTIVITY_CODE_SIGN_IDENTITY: ""
          PROVISIONING_PROFILE_SPECIFIER: "$(LIVE_ACTIVITY_PROVISIONING_PROFILE_SPECIFIER)"
          LIVE_ACTIVITY_PROVISIONING_PROFILE_SPECIFIER: ""
  RemoraWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    entitlements:
      path: Sources/RemoraWatch/RemoraWatch.entitlements
      properties:
        aps-environment: production
        com.apple.security.application-groups:
          - group.com.remora.app
    sources:
      - path: Sources/RemoraWatch
        excludes:
          - "Assets.xcassets"
      - path: Sources/Remora/AppIcon.icon
    resources:
      - path: Sources/Remora/Resources/Fonts
      - path: Sources/RemoraWatch/Assets.xcassets
    dependencies:
      - target: RemoraWatchComplications
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.remora.app.watchkitapp
        INFOPLIST_FILE: Sources/RemoraWatch/Info.plist
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "11.0"
        GENERATE_INFOPLIST_FILE: NO
        SDKROOT: watchos
        SUPPORTS_MACCATALYST: NO
        OTHER_LDFLAGS: ""
        SWIFT_OBJC_BRIDGING_HEADER: ""
        HEADER_SEARCH_PATHS: "$(inherited)"
        SWIFT_INCLUDE_PATHS: "$(inherited)"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          CODE_SIGN_STYLE: "$(WATCH_CODE_SIGN_STYLE)"
          WATCH_CODE_SIGN_STYLE: Automatic
          PROVISIONING_PROFILE_SPECIFIER: "$(WATCH_PROVISIONING_PROFILE_SPECIFIER)"
          WATCH_PROVISIONING_PROFILE_SPECIFIER: ""
        Release:
          CODE_SIGN_STYLE: "$(WATCH_CODE_SIGN_STYLE)"
          WATCH_CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "$(WATCH_CODE_SIGN_IDENTITY)"
          WATCH_CODE_SIGN_IDENTITY: ""
          PROVISIONING_PROFILE_SPECIFIER: "$(WATCH_PROVISIONING_PROFILE_SPECIFIER)"
          WATCH_PROVISIONING_PROFILE_SPECIFIER: ""

  RemoraWatchComplications:
    type: app-extension
    platform: watchOS
    deploymentTarget: "11.0"
    entitlements:
      path: Sources/RemoraWatchComplications/RemoraWatchComplications.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.remora.app
    sources:
      - path: Sources/RemoraWatchComplications
        excludes:
          - "Assets.xcassets"
    resources:
      - path: Sources/RemoraWatchComplications/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.remora.app.watchkitapp.complications
        INFOPLIST_FILE: Sources/RemoraWatchComplications/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "11.0"
        SDKROOT: watchos
        OTHER_LDFLAGS: ""
        SWIFT_OBJC_BRIDGING_HEADER: ""
        HEADER_SEARCH_PATHS: "$(inherited)"
        SWIFT_INCLUDE_PATHS: "$(inherited)"
      configs:
        Debug:
          CODE_SIGN_STYLE: "$(WATCH_COMP_CODE_SIGN_STYLE)"
          WATCH_COMP_CODE_SIGN_STYLE: Automatic
          PROVISIONING_PROFILE_SPECIFIER: "$(WATCH_COMP_PROVISIONING_PROFILE_SPECIFIER)"
          WATCH_COMP_PROVISIONING_PROFILE_SPECIFIER: ""
        Release:
          CODE_SIGN_STYLE: "$(WATCH_COMP_CODE_SIGN_STYLE)"
          WATCH_COMP_CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "$(WATCH_COMP_CODE_SIGN_IDENTITY)"
          WATCH_COMP_CODE_SIGN_IDENTITY: ""
          PROVISIONING_PROFILE_SPECIFIER: "$(WATCH_COMP_PROVISIONING_PROFILE_SPECIFIER)"
          WATCH_COMP_PROVISIONING_PROFILE_SPECIFIER: ""

  RemoraTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests/RemoraTests
    dependencies:
      - target: Remora
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.remora.app.tests
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGNING_ALLOWED: false
        CODE_SIGNING_REQUIRED: false
  RemoraUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests/RemoraUITests
      - path: SnapshotHelper.swift
    dependencies:
      - target: Remora
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.remora.app.uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: Remora
        CODE_SIGNING_ALLOWED: false
        CODE_SIGNING_REQUIRED: false

schemes:
  RemoraWatch:
    build:
      targets:
        RemoraWatch: all
        RemoraWatchComplications: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
    management:
      isShown: true
      orderHint: 2
  Remora:
    build:
      targets:
        Remora: all
    run:
      config: Debug
      customLLDBInit: $(SRCROOT)/.lldbinit
    test:
      config: Debug
      targets:
        - RemoraTests
        - RemoraUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
    management:
      isShown: true
      orderHint: 1
  RemoraMac:
    build:
      targets:
        RemoraMac: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    # Default archive uses Release (sandboxed) for the App Store lane.
    # The direct-distribution script overrides via `-configuration DeveloperID`.
    archive:
      config: Release
    management:
      isShown: true
      orderHint: 3
