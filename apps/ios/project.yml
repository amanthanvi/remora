name: Remora
options:
  bundleIdPrefix: com.remora.app
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  fileTypes:
    icon:
      file: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: targeted
    MARKETING_VERSION: "1.6.0"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_OBJC_BRIDGING_HEADER: Sources/Remora/Bridge/RemoraBridgingHeader.h
    OTHER_LDFLAGS: "$(inherited) -lc++ -lz -lresolv -lcodex_mobile_client"
    HEADER_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/GeneratedRust/Headers"
    SWIFT_INCLUDE_PATHS: "$(inherited) $(PROJECT_DIR)/GeneratedRust/Headers"
    "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": "$(inherited) $(PROJECT_DIR)/GeneratedRust/ios-device"
    "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": "$(inherited) $(PROJECT_DIR)/GeneratedRust/ios-sim"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    DEVELOPMENT_TEAM: UH66Q8ZAYG
    # Xcode 15+ explicit-module builds. First clean build is slightly
    # slower, but module graphs are cached per-target after that, so
    # incremental Swift compiles in the app target drop substantially.
    SWIFT_ENABLE_EXPLICIT_MODULES: "YES"
    CLANG_ENABLE_EXPLICIT_MODULES: "YES"

packages:
  Hairball:
    url: https://github.com/dnakov/hairball.git
    branch: main
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: "147.0.0"
  Nuke:
    url: https://github.com/kean/Nuke.git
    from: "12.8.0"
targets:
  Remora:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    entitlements:
      path: Sources/Remora/Remora.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
        # iCloud KVS sync (Feature C). Re-add when the iCloud container
        # `iCloud.com.remora.app` exists in the Apple Developer Portal
        # AND is enabled on the iOS app's provisioning profile. Without
        # both, archive fails: "Provisioning profile doesn't include the
        # iCloud capability."
        # com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)iCloud.com.remora.app
        com.apple.security.application-groups:
          - group.com.remora.app
    attributes:
      SystemCapabilities:
        com.apple.BackgroundModes:
          enabled: true
        com.apple.Push:
          enabled: true
    sources:
      - path: Sources/Remora
        excludes:
          - "**/*.h"
      - path: Sources/Remora/Bridge/UniFFICodexClient.generated.swift
    resources:
      - path: Sources/Remora/Resources/Fonts
      - path: Sources/Remora/Resources/Themes
      - path: Sources/Remora/Resources/TipJarProducts.storekit
    dependencies:
      - sdk: CoreGraphics.framework
      - sdk: CoreText.framework
      - sdk: CoreVideo.framework
      - sdk: IOSurface.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: Network.framework
      - package: Hairball
        product: HairballUI
      - package: WebRTC
        product: WebRTC
      - package: Nuke
        product: Nuke
      - package: Nuke
        product: NukeUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.remora.app
        INFOPLIST_FILE: Sources/Remora/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Remora/Bridge/RemoraBridgingHeader.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIBackgroundModes: "audio picture-in-picture remote-notification"
      configs:
        Debug:
          APS_ENVIRONMENT: development
          CODE_SIGN_STYLE: "$(APP_CODE_SIGN_STYLE)"
          APP_CODE_SIGN_STYLE: Automatic
          PROVISIONING_PROFILE_SPECIFIER: "$(APP_PROVISIONING_PROFILE_SPECIFIER)"
          APP_PROVISIONING_PROFILE_SPECIFIER: ""
          OTHER_LDFLAGS: "$(inherited) -lc++ -lz -lresolv -lcodex_mobile_client -lghostty"
        Release:
          APS_ENVIRONMENT: production
          CODE_SIGN_STYLE: "$(APP_CODE_SIGN_STYLE)"
          APP_CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "$(APP_CODE_SIGN_IDENTITY)"
          APP_CODE_SIGN_IDENTITY: ""
          PROVISIONING_PROFILE_SPECIFIER: "$(APP_PROVISIONING_PROFILE_SPECIFIER)"
          APP_PROVISIONING_PROFILE_SPECIFIER: ""
          OTHER_LDFLAGS: "$(inherited) -lc++ -lz -lresolv -lcodex_mobile_client -lghostty"
  RemoraMac:
    type: application
    platform: auto
    supportedDestinations:
      - macCatalyst
    entitlements:
      path: Sources/Remora/Remora-Catalyst.entitlements
      properties:
        # iCloud KVS sync (Feature C). Re-add when the iCloud container
        # `iCloud.com.remora.app` exists in the Apple Developer Portal
        # AND the Mac App Store profile is regenerated to include the iCloud
        # capability.
        # com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)iCloud.com.remora.app
        com.apple.security.application-groups:
          - group.com.remora.app
        com.apple.security.app-sandbox: true
        com.apple.security.device.bluetooth: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
    sources:
      - path: Sources/Remora
        excludes:
          - Info.plist
          - Remora.entitlements
          - Remora-Catalyst.entitlements
          - Models/AppLifecycleController.swift
          - Models/AppRuntimeController.swift
          - Models/OrientationResponder.swift
          - Models/RealtimeWebRtcSession.swift
          - Models/StableSafeAreaInsets.swift
          - Models/VoiceRuntimeController.swift
          - Models/VoiceSessionControl.swift
          - Models/VoiceSessionModels.swift
          - Views/HomeVoiceOrbButton.swift
          - Views/InlineVoiceButton.swift
          - Views/InlineVoiceStatusStrip.swift
          - Views/RealtimeVoiceScreen.swift
          - Views/VoiceCallView.swift
          - "**/*.h"
      - path: Sources/Remora/Bridge/UniFFICodexClient.generated.swift
    resources:
      - path: Sources/Remora/Resources/Fonts
      - path: Sources/Remora/Resources/Themes
      - path: Sources/Remora/Resources/TipJarProducts.storekit
    dependencies:
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: Network.framework
      - package: Hairball
        product: HairballUI
      - package: Nuke
        product: Nuke
      - package: Nuke
        product: NukeUI
    settings:
      base:
        PRODUCT_NAME: Remora
        PRODUCT_BUNDLE_IDENTIFIER: com.remora.app
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        INFOPLIST_FILE: Sources/Remora/Info-Catalyst.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconMac
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Remora/Bridge/RemoraBridgingHeader.h
        SUPPORTS_MACCATALYST: YES
        SUPPORTS_MACCATALYST_OPTIMIZED_FOR_MAC: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        "LIBRARY_SEARCH_PATHS[sdk=macosx*]": "$(inherited) $(PROJECT_DIR)/GeneratedRust/ios-macabi"
      configs:
        Debug:
          CODE_SIGN_STYLE: "$(APP_CODE_SIGN_STYLE)"
          APP_CODE_SIGN_STYLE: Automatic
          PROVISIONING_PROFILE_SPECIFIER: "$(APP_PROVISIONING_PROFILE_SPECIFIER)"
          APP_PROVISIONING_PROFILE_SPECIFIER: ""
          OTHER_LDFLAGS: "$(inherited) -lc++ -lz -lresolv -lcodex_mobile_client -lghostty"
        Release:
          CODE_SIGN_STYLE: "$(APP_CODE_SIGN_STYLE)"
          APP_CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "$(APP_CODE_SIGN_IDENTITY)"
          APP_CODE_SIGN_IDENTITY: ""
          PROVISIONING_PROFILE_SPECIFIER: "$(APP_PROVISIONING_PROFILE_SPECIFIER)"
          APP_PROVISIONING_PROFILE_SPECIFIER: ""
          OTHER_LDFLAGS: "$(inherited) -lc++ -lz -lresolv -lcodex_mobile_client -lghostty"

  RemoraTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests/RemoraTests
    dependencies:
      - target: Remora
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.remora.app.tests
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGNING_ALLOWED: false
        CODE_SIGNING_REQUIRED: false
schemes:
  Remora:
    build:
      targets:
        Remora: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RemoraTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
    management:
      isShown: true
      orderHint: 1
  RemoraMac:
    build:
      targets:
        RemoraMac: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
    management:
      isShown: true
      orderHint: 2
