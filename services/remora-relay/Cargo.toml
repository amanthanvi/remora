[package]
name = "remora-relay"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "GPL-3.0-only"
publish = false
description = "Durable opaque event relay and push wake service for Remora"

[features]
required-postgres-tests = []

[lib]
name = "remora_relay"
path = "src/lib.rs"

[[bin]]
name = "remora-relay"
path = "src/main.rs"

[dependencies]
async-trait = "=0.1.89"
axum = { version = "=0.8.9", features = ["json", "macros"] }
base64 = "=0.22.1"
chacha20poly1305 = { version = "=0.11.0", features = ["zeroize"] }
clap = { version = "=4.6.1", features = ["derive"] }
rand = "=0.9.2"
reqwest = { version = "=0.13.4", default-features = false, features = ["http2", "json", "rustls"] }
rusqlite = { version = "=0.39.0", features = ["bundled"] }
secrecy = "=0.10.3"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.11.0"
sqlx = { version = "=0.9.0", default-features = false, features = ["migrate", "postgres", "runtime-tokio", "tls-rustls-ring-native-roots"] }
thiserror = "=2.0.18"
tokio = { version = "=1.52.3", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "=1.1.3"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt", "json"] }
uuid = { version = "=1.23.5", features = ["v4"] }
zeroize = "=1.8.2"

[dev-dependencies]
proptest = "=1.11.0"
tempfile = "=3.27.0"
tower = { version = "=0.5.3", features = ["util"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
